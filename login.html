<!-- Файл: MySite/login.html -->
<!-- Страница входа в систему — аутентификация пользователей -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    
    <!-- Система доступа - ЗАГРУЖАЕТСЯ ПЕРВОЙ -->
    <script type="module" src="static/js/access-init.js"></script>
    
    <link rel="stylesheet" href="static/css/style.css">
    <script type="module" src="static/js/main.js"></script>
    
    <style>
        /* --- Система доступа — временно отключена, весь функционал виден --- */
        #access-overlay {
            display: none !important;
        }
        .access-button {
            display: none !important;
        }

        /* Стили для страницы входа */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
            padding: 2rem;
        }

        /* Карточка входа */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 0.625rem 1.5625rem rgba(0, 0, 0, 0.18);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .login-card .login-subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            font-style: italic;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .login-card .login-subtitle .hint {
            color: #8b0000;
            font-weight: 600;
        }

        /* Форма входа */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .login-form label {
            font-weight: 600;
            color: #444;
            margin-bottom: 0.5rem;
            display: block;
        }

        .login-form input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 0.125rem solid #e0e0e0;
            border-radius: 0.625rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 0.1875rem rgba(52, 152, 219, 0.15);
        }

        /* Кнопки входа */
        .login-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .login-btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border-radius: 0.625rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .login-btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 0.25rem 0.75rem rgba(52, 152, 219, 0.3);
        }

        .login-btn-primary:hover {
            background: #2980b9;
            transform: translateY(-0.125rem);
            box-shadow: 0 0.375rem 1rem rgba(52, 152, 219, 0.4);
        }

        .login-btn-secondary {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .login-btn-secondary:hover {
            background: #dfe6e9;
            color: #34495e;
        }

        /* Список уровней доступа */
        .permission-levels {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 0.0625rem solid #eee;
        }

        .permission-levels h3 {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 1rem;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: rgba(52, 152, 219, 0.05);
            border-radius: 0.5rem;
        }

        .permission-level {
            font-weight: 700;
            color: #3498db;
            min-width: 2rem;
        }

        .permission-desc {
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Затемнение (система доступа) -->
    <div id="access-overlay"></div>
    
    <!-- Панель доступа -->
    <div class="access-button">
        <button id="fileAccessButton">Получить доступ к файлам</button>
    </div>
    
    <!-- Контейнер входа -->
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Вход в систему</h2>
            <p class="login-subtitle">
                Вход только для тех, кто помнит.<br>
                Если вы не помните свой пароль — <span class="hint">претензий нет</span>.
            </p>
            <!-- Форма входа -->
            <form class="login-form" id="loginForm">
                <div>
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div>
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="login-actions">
                    <button type="submit" class="login-btn login-btn-primary">Войти</button>
                    <button type="button" class="login-btn login-btn-secondary" onclick="history.back()">Назад</button>
                </div>
            </form>

            <!-- Ссылка на регистрацию -->
            <div style="text-align: center; margin-top: 1rem;">
                <a href="register.html" style="color: #3498db; text-decoration: none; font-size: 14px; font-weight: 600;">
                    Зарегистрироваться
                </a>
            </div>

            <!-- Уровни доступа -->
            <div class="permission-levels">
                <h3>Уровни доступа:</h3>
                <div class="permission-item">
                    <span class="permission-level">0</span>
                    <span class="permission-desc">Гость — только просмотр</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">1</span>
                    <span class="permission-desc">Пользователь — добавление новостей</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">2</span>
                    <span class="permission-desc">Модератор — редактирование и удаление</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">3</span>
                    <span class="permission-desc">Администратор — полный доступ</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
