<!-- login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
            padding: 2rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 0.625rem 1.5625rem rgba(0, 0, 0, 0.18);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .login-form label {
            font-weight: 600;
            color: #444;
            margin-bottom: 0.5rem;
            display: block;
        }

        .login-form input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 0.125rem solid #e0e0e0;
            border-radius: 0.625rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 0.1875rem rgba(52, 152, 219, 0.15);
        }

        .login-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .login-btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border-radius: 0.625rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .login-btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 0.25rem 0.75rem rgba(52, 152, 219, 0.3);
        }

        .login-btn-primary:hover {
            background: #2980b9;
            transform: translateY(-0.125rem);
            box-shadow: 0 0.375rem 1rem rgba(52, 152, 219, 0.4);
        }

        .login-btn-secondary {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .login-btn-secondary:hover {
            background: #dfe6e9;
            color: #34495e;
        }

        .permission-levels {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 0.0625rem solid #eee;
        }

        .permission-levels h3 {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 1rem;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: rgba(52, 152, 219, 0.05);
            border-radius: 0.5rem;
        }

        .permission-level {
            font-weight: 700;
            color: #3498db;
            min-width: 2rem;
        }

        .permission-desc {
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Вход в систему</h2>
            <form class="login-form" id="loginForm">
                <div>
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div>
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="login-actions">
                    <button type="submit" class="login-btn login-btn-primary">Войти</button>
                    <button type="button" class="login-btn login-btn-secondary" onclick="history.back()">Назад</button>
                </div>
            </form>

            <div class="permission-levels">
                <h3>Уровни доступа:</h3>
                <div class="permission-item">
                    <span class="permission-level">0</span>
                    <span class="permission-desc">Гость — только просмотр</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">1</span>
                    <span class="permission-desc">Пользователь — добавление новостей</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">2</span>
                    <span class="permission-desc">Модератор — редактирование и удаление</span>
                </div>
                <div class="permission-item">
                    <span class="permission-level">3</span>
                    <span class="permission-desc">Администратор — полный доступ</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Logger } from './static/js/logger.js';

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    Logger.error('Вход', 'Заполните все поля');
                    return;
                }

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        Logger.log(`Успешный вход! Уровень доступа: ${data.level}`);
                        // Здесь можно сохранить токен или уровень доступа
                        // localStorage.setItem('user_level', data.level);
                        // localStorage.setItem('user_token', data.token);
                        
                        // Редирект на предыдущую страницу или на главную
                        history.back();
                        // или window.location.href = '/';
                    } else {
                        Logger.error('Вход', data.message || 'Неверные учетные данные');
                        alert('Неверное имя пользователя или пароль');
                    }
                } catch (error) {
                    Logger.error('Ошибка входа', error);
                    alert('Ошибка сервера. Попробуйте позже.');
                }
            });
        });
    </script>
</body>
</html>
