<!-- catalog.html — упрощённая версия, форма встроена, скрипты только main.js -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Каталог товаров - Хроно-архив TVA</title>
    
    <!-- Управление доступом - ЗАГРУЖАЕТСЯ ПЕРВЫМ -->
    <script type="module" src="./static/js/access-init.js"></script>
    
    <link rel="stylesheet" href="./static/css/style.css" />
    <link rel="stylesheet" href="./static/css/news.css?v=2" />
    
    <style>
        /* --- Система доступа — временно отключена, весь функционал виден --- */
        #access-overlay {
            display: none !important;
        }
        .access-button {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="access-overlay"></div>
    
    <div class="access-button">
        <button id="fileAccessButton">Получить доступ к файлам</button>
    </div>

    <div class="header-group">
        <header class="site-header">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="Логотип магазина воспоминаний" class="logo">
                <span class="site-title"></span>
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="actions.html">Акции</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                    <li><a href="news.html">Новости</a></li>
                    <li><a href="requisites.html">Реквизиты</a></li>
                </ul>
            </nav>
            <div class="auth-link">
                <a href="login.html">Клиентам</a>
            </div>
        </header>
        <div class="news-header-panel" id="newsHeaderPanel">
            <div class="header-grid">
                <h1>Каталог товаров</h1>
                <div class="last-update update-date">—</div>
                <button class="add-news-btn">Добавить лот</button>
            </div>
        </div>
    </div>

    <main>
        <section class="catalog">
            <div class="products-grid"></div>
        </section>
    </main>

    <!-- Модальное окно для ПРОСМОТРА -->
    <div id="viewNewsModal" class="modal hidden">
        <div class="modal-content"></div>
    </div>

    <!-- Модальное окно для ДОБАВЛЕНИЯ -->
    <div id="addNewsModal" class="modal hidden">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Добавление лота</h2>
                </div>
                <div class="modal-body">
                    <form id="newsForm" class="modal-form">
                        <!-- Табы: Новость / Товар -->
                        <div class="form-tabs">
                            <button type="button" class="form-tab active" data-lottype="news">📰 Новость</button>
                            <button type="button" class="form-tab" data-lottype="product">🏷️ Товар</button>
                        </div>

                        <div class="file-upload-wrapper">
                            <label for="image" class="file-upload-label">
                                <span>📷</span>
                                <span>Выберите файл для иллюстрации...</span>
                            </label>
                            <input type="file" id="image" accept="image/*" style="display: none" />
                        </div>
                        <input type="text" id="title" placeholder="Заголовок" required class="modal-input" />
                        <div class="field-group field-group-date" id="dateGroup">
                            <input type="date" id="date" class="modal-input" />
                        </div>
                        <div class="field-group field-group-price" id="priceGroup">
                            <input type="number" id="price" placeholder="Цена" class="modal-input" />
                        </div>
                        <textarea id="preview" placeholder="Краткое описание" class="modal-textarea" rows="4"></textarea>
                        <textarea id="content" placeholder="Полный текст" class="modal-textarea" rows="6"></textarea>
                        <div class="modal-actions">
                            <button type="submit" class="btn-submit">Сохранить</button>
                            <button type="button" class="cancel-btn">Отмена</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной скрипт -->
    <script type="module" src="./static/js/main.js"></script>
    
    <footer class="site-footer">
        <p>© 2026 3+3+3+3+3+3=7 Сувенирный магазин. Всё не то, чем кажется.</p>
        <ul class="footer-links">
            <li><a href="privacy.html">Политика конфиденциальности</a></li>
            <li><a href="delivery.html">Доставка и оплата</a></li>
        </ul>
    </footer>
</body>
</html>
